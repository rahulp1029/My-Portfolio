<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Software Engineer Portfolio</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="background">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
</div>
<div class="container">
    <div class="left">
        <h1>Welcome Back</h1>
        <p>
            Login to explore my Software Engineer Portfolio
            built using HTML, CSS and JavaScript.
        </p>
        <ul>
            <li><i class="fa-solid fa-check"></i> Responsive Design</li>
            <li><i class="fa-solid fa-check"></i> CSS Flexbox & Grid</li>
            <li><i class="fa-solid fa-check"></i> JavaScript Projects</li>
            <li><i class="fa-solid fa-check"></i> Beautiful Animations</li>
        </ul>
    </div>
    <div class="right">
        <form id="loginForm">
            <h2>Login</h2>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email"
                required>
            </div>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required>
                <span id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
            <button type="submit">
                Login
            </button>
            <p class="register-text">
                Don't have an account?
                <a href="register.html">
                    Register Here
                </a>
            </p>
        </form>
    </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
